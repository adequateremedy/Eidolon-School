<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trade &amp; Tally — Loop Belt Demo</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: Georgia, 'Times New Roman', serif;
        background: #171310 url('../trade-and-tally/assets/images/bg/Classroom-Floor.png') center / cover no-repeat fixed;
        color: #f0e2c4;
        overflow: hidden;
        -webkit-user-select: none; user-select: none;
        touch-action: none;
    }
    #shade { position: fixed; inset: 0; background: rgba(16, 11, 7, 0.45); }

    .plate {
        background: linear-gradient(180deg, #2e2620, #1d1712);
        border: 2px solid #a07d3c; border-radius: 10px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.6), inset 0 1px 0 rgba(240,226,196,0.15);
    }
    #titlePlate {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        padding: 7px 26px 9px; text-align: center; z-index: 40; white-space: nowrap;
    }
    #titlePlate h1 { font-size: clamp(16px, 3.2vw, 25px); letter-spacing: 2px; color: #e8c97a; font-weight: normal; }
    #titlePlate p { font-size: clamp(11px, 2vw, 13px); color: #c9b48a; font-style: italic; margin-top: 2px; }

    #hud {
        position: fixed; top: 12px; left: 12px; z-index: 40;
        padding: 7px 14px; font-size: clamp(12px, 2.2vw, 15px); color: #f0e2c4; letter-spacing: 0.5px;
    }
    #hud b { color: #e8c97a; font-weight: normal; }

    #stage {
        position: fixed; left: 50%; top: 53%; transform: translate(-50%, -50%);
        width: min(98vw, 1090px);
        aspect-ratio: 1000 / 700;
        z-index: 5;
    }
    #beltSvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

    .item {
        position: absolute; width: 7.6%; aspect-ratio: 1; object-fit: contain;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 6px 5px rgba(0,0,0,0.55));
        z-index: 20; pointer-events: none;
    }

    /* ---- lines of waiting items ---- */
    .line { position: absolute; z-index: 25; cursor: pointer; transform: translate(-50%, 0); }
    .line .slots { display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; }
    .line.below .slots { flex-direction: column; }
    .slot {
        width: clamp(34px, 4.9vw, 52px); aspect-ratio: 1;
        border-radius: 8px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #241d16, #171310);
        border: 2px solid #6d5626;
        box-shadow: 0 3px 8px rgba(0,0,0,0.55);
    }
    .slot.front { border-color: #c9a24d; background: linear-gradient(180deg, #33291d, #20180f); }
    .slot img { width: 88%; height: 88%; object-fit: contain; pointer-events: none; }
    .slot .q { color: #a07d3c; font-size: clamp(15px, 2.6vw, 22px); font-style: italic; }
    .line .arrow { text-align: center; color: #e8c97a; font-size: clamp(13px, 2.2vw, 18px); line-height: 1; margin: 2px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .line .more {
        margin-top: 3px; text-align: center; font-size: clamp(10px, 1.8vw, 12px); color: #c9b48a;
        background: rgba(23,19,16,0.85); border: 1px solid #6d5626; border-radius: 7px; padding: 1px 6px;
    }
    .line.empty { opacity: 0.25; pointer-events: none; }
    .line.shake { animation: shake 0.35s ease; }
    @keyframes shake {
        0%, 100% { margin-left: 0; }
        25% { margin-left: -7px; }
        50% { margin-left: 6px; }
        75% { margin-left: -4px; }
    }

    /* ---- crate docks in the island ---- */
    .dock {
        position: absolute; z-index: 15; width: 12.5%; transform: translate(-50%, -50%);
        text-align: center; transition: opacity 0.35s ease, margin-top 0.35s ease;
    }
    .dock img.crate { width: 100%; display: block; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.6)); }
    .dock .want {
        position: absolute; top: -16%; left: 50%; transform: translateX(-50%);
        width: 44%; aspect-ratio: 1; object-fit: contain;
        filter: drop-shadow(0 3px 4px rgba(0,0,0,0.7));
    }
    .dock .tally {
        margin-top: 2px; display: inline-block;
        background: linear-gradient(180deg, #2e2620, #1d1712);
        border: 2px solid #a07d3c; border-radius: 8px;
        padding: 2px 10px; font-size: clamp(11px, 2vw, 15px); color: #f0e2c4;
    }
    .dock .tally b { color: #e8c97a; font-weight: normal; }
    .dock.shipping { opacity: 0; margin-top: 26px; }
    .dock.arriving { animation: arrive 0.4s ease; }
    @keyframes arrive { from { opacity: 0; margin-top: -22px; } to { opacity: 1; margin-top: 0; } }
    .dock.idle { opacity: 0.35; }

    /* ---- centre plates ---- */
    #bigPlate {
        position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(0.94);
        padding: 24px 40px; text-align: center; z-index: 70; border-width: 3px; border-radius: 14px;
        opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
        max-width: 92vw;
    }
    #bigPlate.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    #bigPlate h2 { color: #e8c97a; letter-spacing: 2px; font-weight: normal; font-size: clamp(19px, 4vw, 29px); }
    #bigPlate p { color: #c9b48a; font-style: italic; margin-top: 7px; font-size: clamp(13px, 2.4vw, 16px); }
    #bigPlate button {
        margin-top: 15px; font-family: inherit; cursor: pointer;
        font-size: clamp(14px, 2.6vw, 18px); letter-spacing: 1px;
        color: #1d1712; background: linear-gradient(180deg, #e8c97a, #b98f35);
        border: 2px solid #6d5626; border-radius: 9px; padding: 8px 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #bigPlate button:active { transform: translateY(2px); }
</style>
</head>
<body>
<div id="shade"></div>

<div id="titlePlate" class="plate">
    <h1>TRADE &amp; TALLY</h1>
    <p>Tap a line to send its front item onto the loop</p>
</div>

<div id="hud" class="plate">Round <b id="hudRound">1</b> of 3 &nbsp;·&nbsp; Score <b id="hudScore">0</b> &nbsp;·&nbsp; Belt <b id="hudBelt">0 / 8</b></div>

<div id="stage">
    <svg id="beltSvg" viewBox="0 0 1000 700" preserveAspectRatio="none">
        <defs>
            <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#c9a24d"/>
                <stop offset="0.5" stop-color="#8a6b32"/>
                <stop offset="1" stop-color="#5f4720"/>
            </linearGradient>
            <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3b342c"/>
                <stop offset="0.5" stop-color="#241e18"/>
                <stop offset="1" stop-color="#171310"/>
            </linearGradient>
        </defs>
        <g id="wheelLayer"></g>
        <path id="beltOuter" d="" fill="none" stroke="url(#brass)" stroke-width="118" stroke-linecap="round"/>
        <path id="beltBed" d="" fill="none" stroke="url(#iron)" stroke-width="100" stroke-linecap="round"/>
        <path id="beltTread" d="" fill="none" stroke="rgba(232,201,122,0.16)" stroke-width="100" stroke-dasharray="30 22" stroke-linecap="butt"/>
        <path id="beltPin" d="" fill="none" stroke="rgba(160,125,60,0.55)" stroke-width="3" stroke-dasharray="2 14"/>
        <path id="ridePath" d="" fill="none" stroke="none"/>
    </svg>
    <div id="dockLayer"></div>
    <div id="itemLayer"></div>
    <div id="lineLayer"></div>
</div>

<div id="bigPlate" class="plate">
    <h2 id="bpTitle">ROUND 1</h2>
    <p id="bpText"></p>
    <button id="bpButton">Start</button>
</div>

<script>
(function () {
    var ITEM = '../trade-and-tally/assets/images/items/';
    var TYPES = {
        pliers: { name: 'Pliers', file: ITEM + 'tools/Pliers-removebg-preview.png' },
        bolt:   { name: 'Bolt',   file: ITEM + 'mechanical_parts/Bolt-removebg-preview.png' },
        gear:   { name: 'Gear',   file: ITEM + 'gears_cogs/Gear.png' },
        nut:    { name: 'Nut',    file: ITEM + 'mechanical_parts/Nut-removebg-preview.png' },
        hammer: { name: 'Hammer', file: ITEM + 'tools/Hammer-removebg-preview.png' },
        screw:  { name: 'Screw',  file: ITEM + 'mechanical_parts/Screw-removebg-preview.png' }
    };

    var PATH_OVAL  = 'M 340 190 L 660 190 A 130 160 0 0 1 660 510 L 340 510 A 130 160 0 0 1 340 190 Z';
    var PATH_NOTCH = 'M 340 190 L 660 190 A 130 160 0 0 1 660 510 L 568 510 A 58 65 0 0 0 568 380 L 432 380 A 58 65 0 0 0 432 510 L 340 510 A 130 160 0 0 1 340 190 Z';
    var PATH_TWIN  = 'M 340 190 L 392 190 A 52 60 0 0 0 496 190 L 660 190 A 130 160 0 0 1 660 510 L 640 510 A 52 60 0 0 0 640 390 L 520 390 A 52 60 0 0 0 520 510 L 340 510 A 130 160 0 0 1 340 190 Z';

    var ROUNDS = [
        {
            path: PATH_OVAL, speed: 58, capacity: 8, dockCount: 2,
            dockPos: [[395, 350], [605, 350]],
            crates: [['pliers', 3], ['bolt', 3]],
            lines: [
                { pos: [300, 118], side: 'above', items: ['pliers', 'bolt'] },
                { pos: [500, 118], side: 'above', items: ['bolt', 'pliers'] },
                { pos: [700, 118], side: 'above', items: ['pliers', 'bolt'] }
            ]
        },
        {
            path: PATH_NOTCH, speed: 66, capacity: 9, dockCount: 2,
            dockPos: [[318, 312, 11], [682, 312, 11]],
            crates: [['gear', 3], ['pliers', 4], ['nut', 3]],
            lines: [
                { pos: [280, 118], side: 'above', items: ['gear', 'pliers', 'nut'] },
                { pos: [500, 118], side: 'above', items: ['pliers', 'nut', 'gear'] },
                { pos: [720, 118], side: 'above', items: ['nut', 'gear', 'pliers'] },
                { pos: [320, 585], side: 'below', items: ['pliers'] }
            ]
        },
        {
            path: PATH_TWIN, speed: 74, capacity: 10, dockCount: 3,
            dockPos: [[350, 405, 11], [645, 290, 11], [580, 495, 9.5]],
            crates: [['hammer', 4], ['gear', 4], ['screw', 4], ['bolt', 4]],
            lines: [
                { pos: [260, 118], side: 'above', items: ['hammer', 'screw', 'bolt'] },
                { pos: [500, 118], side: 'above', items: ['gear', 'hammer', 'screw'] },
                { pos: [740, 118], side: 'above', items: ['bolt', 'gear', 'hammer'] },
                { pos: [300, 585], side: 'below', items: ['screw', 'bolt', 'gear'] },
                { pos: [700, 585], side: 'below', items: ['hammer', 'screw', 'bolt', 'gear'] }
            ]
        }
    ];

    var GAP = 118;          // belt units between items — they never stack
    var ENTRY_GAP = 128;    // a line can only release into this much clear belt

    var stage = document.getElementById('stage');
    var ridePath = document.getElementById('ridePath');
    var tread = document.getElementById('beltTread');
    var wheelLayer = document.getElementById('wheelLayer');
    var itemLayer = document.getElementById('itemLayer');
    var lineLayer = document.getElementById('lineLayer');
    var dockLayer = document.getElementById('dockLayer');
    var svgNS = 'http://www.w3.org/2000/svg';

    var roundIdx = 0, score = 0, LEN = 0, odometer = 0, lastEntryOdo = 0;
    var running = false, roundOver = false;
    var belt = [];          // {el, type, d (continuous), entering}
    var lines = [];         // {cfg, items[], el, gate}
    var docks = [];         // {el, crate|null {type, need, got}, gate, busy}
    var crateQueue = [];

    function setPath(d) {
        ['beltOuter', 'beltBed', 'beltTread', 'beltPin', 'ridePath'].forEach(function (id) {
            document.getElementById(id).setAttribute('d', d);
        });
        LEN = ridePath.getTotalLength();
        wheelLayer.innerHTML = '';
        for (var dist = 0; dist < LEN; dist += 92) {
            var pt = ridePath.getPointAtLength(dist);
            // no wheels on sharp turns — their rims scribble across the channel
            var pa = ridePath.getPointAtLength((dist - 26 + LEN) % LEN);
            var pb = ridePath.getPointAtLength((dist + 26) % LEN);
            var v1x = pt.x - pa.x, v1y = pt.y - pa.y, v2x = pb.x - pt.x, v2y = pb.y - pt.y;
            var ang = Math.acos(Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1)))) * 57.3;
            if (ang > 28) continue;
            var g = document.createElementNS(svgNS, 'g');
            var c = document.createElementNS(svgNS, 'circle');
            c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('r', 56);
            c.setAttribute('fill', '#241c14'); c.setAttribute('stroke', '#6d5626'); c.setAttribute('stroke-width', '5');
            g.appendChild(c);
            for (var s = 0; s < 3; s++) {
                var a = (Math.PI * 2 / 3) * s;
                var line = document.createElementNS(svgNS, 'line');
                line.setAttribute('x1', pt.x - Math.cos(a) * 46); line.setAttribute('y1', pt.y - Math.sin(a) * 46);
                line.setAttribute('x2', pt.x + Math.cos(a) * 46); line.setAttribute('y2', pt.y + Math.sin(a) * 46);
                line.setAttribute('stroke', '#54431f'); line.setAttribute('stroke-width', '7');
                g.appendChild(line);
            }
            var hub = document.createElementNS(svgNS, 'circle');
            hub.setAttribute('cx', pt.x); hub.setAttribute('cy', pt.y); hub.setAttribute('r', 11);
            hub.setAttribute('fill', '#a07d3c'); hub.setAttribute('stroke', '#5f4720'); hub.setAttribute('stroke-width', '3');
            g.appendChild(hub);
            g.dataset.cx = pt.x; g.dataset.cy = pt.y;
            wheelLayer.appendChild(g);
        }
    }

    function nearestDist(x, y) {
        var best = 0, bestD = 1e12;
        for (var d = 0; d < LEN; d += 4) {
            var pt = ridePath.getPointAtLength(d);
            var dd = (pt.x - x) * (pt.x - x) + (pt.y - y) * (pt.y - y);
            if (dd < bestD) { bestD = dd; best = d; }
        }
        return best;
    }

    function circDist(a, b) {
        var diff = Math.abs(a - b) % LEN;
        return Math.min(diff, LEN - diff);
    }

    // ---------- lines ----------
    function renderLine(line) {
        var items = line.items;
        var html = '<div class="slots">';
        if (!items.length) {
            html += '<div class="slot"><span class="q">·</span></div>';
        } else {
            html += '<div class="slot front"><img src="' + TYPES[items[0]].file + '" alt="' + TYPES[items[0]].name + '"></div>';
            var behind = Math.min(2, items.length - 1);
            for (var i = 0; i < behind; i++) html += '<div class="slot"><span class="q">?</span></div>';
        }
        html += '</div>';
        html += '<div class="arrow">' + (line.cfg.side === 'above' ? '▼' : '▲') + '</div>';
        if (items.length - 1 > 2) html += '<div class="more">+ ' + (items.length - 3) + ' more</div>';
        line.el.innerHTML = html;
        line.el.classList.toggle('empty', !items.length);
    }

    function buildLines(cfg) {
        lineLayer.innerHTML = '';
        lines = cfg.lines.map(function (lc) {
            var el = document.createElement('div');
            el.className = 'line' + (lc.side === 'below' ? ' below' : '');
            el.style.left = (lc.pos[0] / 10) + '%';
            if (lc.side === 'above') el.style.bottom = (100 - lc.pos[1] / 7) + '%';
            else el.style.top = (lc.pos[1] / 7) + '%';
            lineLayer.appendChild(el);
            var line = { cfg: lc, items: lc.items.slice(), el: el, gate: nearestDist(lc.pos[0], lc.side === 'above' ? 190 : 510) };
            el.addEventListener('pointerdown', function (e) { e.preventDefault(); tapLine(line); });
            renderLine(line);
            return line;
        });
    }

    function tapLine(line) {
        if (!running || roundOver) return;
        if (!line.items.length) return;
        if (belt.length >= ROUNDS[roundIdx].capacity) { shake(line); return; }
        var gatePos = line.gate;
        for (var i = 0; i < belt.length; i++) {
            if (circDist(belt[i].d % LEN, gatePos) < ENTRY_GAP) { shake(line); return; }
        }
        var type = line.items.shift();
        renderLine(line);
        // enter at the gate, on the current lap of the belt's travel
        var baseLap = Math.floor(odometer / LEN) * LEN;
        var d = baseLap + gatePos;
        while (d < odometer - LEN * 0.5) d += LEN;
        var img = document.createElement('img');
        img.className = 'item'; img.src = TYPES[type].file; img.alt = TYPES[type].name;
        itemLayer.appendChild(img);
        var obj = { el: img, type: type, d: d, entering: null, lastGateLap: {} };
        belt.push(obj);
        placeItem(obj);
        updateHud();
    }

    function shake(line) {
        line.el.classList.remove('shake');
        void line.el.offsetWidth;
        line.el.classList.add('shake');
    }

    // ---------- docks / crates ----------
    function buildDocks(cfg) {
        dockLayer.innerHTML = '';
        docks = [];
        crateQueue = cfg.crates.map(function (c) { return { type: c[0], need: c[1], got: 0 }; });
        for (var i = 0; i < cfg.dockCount; i++) {
            var el = document.createElement('div');
            el.className = 'dock';
            el.style.left = (cfg.dockPos[i][0] / 10) + '%';
            el.style.top = (cfg.dockPos[i][1] / 7) + '%';
            if (cfg.dockPos[i][2]) el.style.width = cfg.dockPos[i][2] + '%';
            dockLayer.appendChild(el);
            var dock = { el: el, crate: null, gate: nearestDist(cfg.dockPos[i][0], cfg.dockPos[i][1]), busy: false, pos: cfg.dockPos[i] };
            docks.push(dock);
            fillDock(dock, false);
        }
    }

    function fillDock(dock, animate) {
        dock.crate = crateQueue.length ? crateQueue.shift() : null;
        dock.busy = false;
        if (!dock.crate) {
            dock.el.innerHTML = '';
            dock.el.className = 'dock idle';
            return;
        }
        dock.el.className = 'dock' + (animate ? ' arriving' : '');
        dock.el.innerHTML =
            '<img class="want" src="' + TYPES[dock.crate.type].file + '" alt="">' +
            '<img class="crate" src="../trade-and-tally/ui/box_empty.png" alt="">' +
            '<div class="tally">' + TYPES[dock.crate.type].name + ' <b>' + dock.crate.got + ' / ' + dock.crate.need + '</b></div>';
    }

    function shipDock(dock) {
        dock.busy = true;
        score += 50;
        dock.el.classList.add('shipping');
        setTimeout(function () { fillDock(dock, true); updateHud(); checkRoundEnd(); }, 420);
        updateHud();
    }

    // ---------- items on the belt ----------
    function placeItem(obj) {
        var pt = ridePath.getPointAtLength(((obj.d % LEN) + LEN) % LEN);
        obj.el.style.left = (pt.x / 10) + '%';
        obj.el.style.top = (pt.y / 7) + '%';
    }

    function sendIntoCrate(obj, dock) {
        obj.entering = { dock: dock, t: 0, fromX: parseFloat(obj.el.style.left), fromY: parseFloat(obj.el.style.top) };
        dock.crate.got++;
        lastEntryOdo = odometer;
        var tally = dock.el.querySelector('.tally b');
        if (tally) tally.textContent = dock.crate.got + ' / ' + dock.crate.need;
    }

    function finishEntry(obj) {
        obj.el.remove();
        belt = belt.filter(function (i) { return i !== obj; });
        var dock = obj.entering.dock;
        if (dock.crate && dock.crate.got >= dock.crate.need) shipDock(dock);
        updateHud();
        checkRoundEnd();
    }

    function checkRoundEnd() {
        if (roundOver) return;
        var anyCrate = docks.some(function (d) { return d.crate; }) || crateQueue.length;
        if (!anyCrate && !belt.length) {
            roundOver = true;
            running = false;
            if (roundIdx < ROUNDS.length - 1) {
                showPlate('ROUND ' + (roundIdx + 1) + ' SHIPPED', 'Every crate tallied right. Score so far: ' + score + '.', 'Round ' + (roundIdx + 2), function () {
                    roundIdx++;
                    startRound();
                });
            } else {
                showPlate('THAT IS THE SHAPE OF IT', 'Three rounds, each one harder — more lines, more crates, a tighter loop. In the full class the rounds keep climbing until the player reaches 2000 and passes with an A+.', 'Play again', function () {
                    roundIdx = 0; score = 0;
                    startRound();
                });
            }
        }
    }

    function jamRound() {
        roundOver = true;
        running = false;
        showPlate('THE BELT JAMMED', 'The loop filled up and nothing on it could get into a crate. That round is lost — it can always be won by choosing the order the items come out.', 'Try round ' + (roundIdx + 1) + ' again', function () {
            startRound();
        });
    }

    // ---------- round flow ----------
    function startRound() {
        var cfg = ROUNDS[roundIdx];
        belt.forEach(function (i) { i.el.remove(); });
        belt = [];
        odometer = 0; lastEntryOdo = 0;
        roundOver = false;
        setPath(cfg.path);
        buildDocks(cfg);
        buildLines(cfg);
        hidePlate();
        running = true;
        updateHud();
    }

    function updateHud() {
        document.getElementById('hudRound').textContent = roundIdx + 1;
        document.getElementById('hudScore').textContent = score;
        document.getElementById('hudBelt').textContent = belt.length + ' / ' + ROUNDS[roundIdx].capacity;
    }

    var plateCb = null;
    function showPlate(title, text, btn, cb) {
        document.getElementById('bpTitle').textContent = title;
        document.getElementById('bpText').textContent = text;
        document.getElementById('bpButton').textContent = btn;
        document.getElementById('bigPlate').classList.add('show');
        plateCb = cb;
    }
    function hidePlate() { document.getElementById('bigPlate').classList.remove('show'); }
    document.getElementById('bpButton').addEventListener('click', function () {
        hidePlate();
        if (plateCb) { var cb = plateCb; plateCb = null; cb(); }
    });

    // ---------- the ride ----------
    var last = null;
    function frame(ts) {
        if (last === null) last = ts;
        var dt = Math.min(0.05, (ts - last) / 1000);
        last = ts;

        if (running && !roundOver) {
            var cfg = ROUNDS[roundIdx];
            var step = cfg.speed * dt;
            odometer += step;
            tread.style.strokeDashoffset = -(odometer % 52);
            var wheels = wheelLayer.children;
            for (var w = 0; w < wheels.length; w++) {
                wheels[w].setAttribute('transform', 'rotate(' + ((odometer / 56 * 57.3) % 360) + ' ' + wheels[w].dataset.cx + ' ' + wheels[w].dataset.cy + ')');
            }

            // traffic: nobody passes the item ahead, nobody stacks
            var sorted = belt.slice().sort(function (a, b) { return a.d - b.d; });
            for (var i = 0; i < sorted.length; i++) {
                var obj = sorted[i];
                if (obj.entering) continue;
                var ahead = sorted[i + 1];
                var limit = ahead ? ahead.d - GAP : (sorted[0].d + LEN) - GAP;
                obj.d = Math.min(obj.d + step, limit);
                if (obj.d < sorted[0].d) obj.d = sorted[0].d;
            }

            // gates: an item whose crate is docked hops in as it passes
            for (var j = belt.length - 1; j >= 0; j--) {
                var it = belt[j];
                if (it.entering) continue;
                for (var k = 0; k < docks.length; k++) {
                    var dock = docks[k];
                    if (!dock.crate || dock.busy || dock.crate.type !== it.type) continue;
                    var lapKey = k;
                    var lap = Math.floor((it.d - dock.gate) / LEN);
                    if (it.lastGateLap[lapKey] === undefined) { it.lastGateLap[lapKey] = lap; continue; }
                    if (lap > it.lastGateLap[lapKey]) {
                        it.lastGateLap[lapKey] = lap;
                        sendIntoCrate(it, dock);
                        break;
                    }
                }
            }

            // entry flights
            for (var m = 0; m < belt.length; m++) {
                var e = belt[m];
                if (e.entering) {
                    e.entering.t += dt / 0.35;
                    var t = Math.min(1, e.entering.t);
                    var dx = e.entering.dock.pos[0] / 10, dy = e.entering.dock.pos[1] / 7;
                    e.el.style.left = (e.entering.fromX + (dx - e.entering.fromX) * t) + '%';
                    e.el.style.top = (e.entering.fromY + (dy - e.entering.fromY) * t) + '%';
                    e.el.style.transform = 'translate(-50%, -50%) scale(' + (1 - t * 0.55) + ')';
                    if (t >= 1) { finishEntry(e); m--; }
                } else {
                    placeItem(e);
                }
            }

            // a full belt that goes all the way around with nothing getting in is jammed
            if (belt.length >= cfg.capacity && odometer - lastEntryOdo >= LEN) jamRound();
        }

        requestAnimationFrame(frame);
    }

    setPath(ROUNDS[0].path);
    showPlate('TRADE & TALLY', 'Items wait in lines. Tap a line and its front item rides the loop until its crate has a spot for it. Fill every crate to ship the round.', 'Start round 1', function () {
        startRound();
    });
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
